name: kotemal_app
description: "K'OTEMAL: aplicación de entrega de comida."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  ota_update: ^7.1.0
  http: ^1.6.0
  permission_handler: 12.0.1
  url_launcher: ^6.3.3
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
  image_cropper: ^12.2.1
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#F3ECE4"
    theme_color: "#4B2618"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F3ECE4"
  adaptive_icon_foreground: "assets/images/logo.png"